[nosetests]
verbosity=2
with-spec=1
spec-color=1
with-coverage=1
cover-erase=1
cover-package=service

[coverage:report]
show_missing = True

[flake8]
max-line-length = 127
exclude = 
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist
per-file-ignores =
    */__init__.py: F401, E402

[pylint]
max-line-length = 127
disable =
    C0111, ; missing-docstring
    R0903, ; too-few-public-methods
ignore = 
    .git,
    __pycache__,
    venv
